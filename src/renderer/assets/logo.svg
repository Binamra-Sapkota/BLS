<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#003311" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#030706" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="50%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <linearGradient id="neonGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>

    <linearGradient id="darkPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1915"/>
      <stop offset="100%" stop-color="#060c0a"/>
    </linearGradient>

    <linearGradient id="accentStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00ffcc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glowing Drop Shadow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="96" fill="#070c0a"/>
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>

  <!-- Outer Tech Hexagon / Rounded Shield Frame -->
  <path d="M256 36 L450 110 L450 360 L256 476 L62 360 L62 110 Z" 
        fill="url(#darkPlate)" 
        stroke="url(#accentStroke)" 
        stroke-width="3" 
        stroke-dasharray="12 6"
        opacity="0.85"/>

  <!-- Inner Cyber Grid Accent Lines -->
  <g opacity="0.15" stroke="#00ff66" stroke-width="1.5">
    <line x1="120" y1="140" x2="392" y2="140" />
    <line x1="120" y1="256" x2="392" y2="256" />
    <line x1="120" y1="372" x2="392" y2="372" />
    <line x1="160" y1="90" x2="160" y2="420" />
    <line x1="256" y1="60" x2="256" y2="450" />
    <line x1="352" y1="90" x2="352" y2="420" />
  </g>

  <!-- Corner Tech Accents -->
  <path d="M80 140 L80 118 L102 118" fill="none" stroke="#00ff88" stroke-width="4" filter="url(#subtleGlow)"/>
  <path d="M432 140 L432 118 L410 118" fill="none" stroke="#00ff88" stroke-width="4" filter="url(#subtleGlow)"/>
  <path d="M80 330 L80 352 L102 352" fill="none" stroke="#00ff88" stroke-width="4" filter="url(#subtleGlow)"/>
  <path d="M432 330 L432 352 L410 352" fill="none" stroke="#00ff88" stroke-width="4" filter="url(#subtleGlow)"/>

  <!-- Server Terminal Pulse Nodes -->
  <circle cx="256" cy="62" r="5" fill="#00ff66" filter="url(#neonGlow)"/>
  <circle cx="430" cy="120" r="4" fill="#00e5ff" filter="url(#neonGlow)"/>
  <circle cx="430" cy="350" r="4" fill="#00ff66" filter="url(#neonGlow)"/>
  <circle cx="82" cy="120" r="4" fill="#00e5ff" filter="url(#neonGlow)"/>
  <circle cx="82" cy="350" r="4" fill="#00ff66" filter="url(#neonGlow)"/>

  <!-- Stylized Geometric "BLS" Typography -->
  <g filter="url(#neonGlow)" id="bls-letters">
    <!-- Letter B -->
    <path d="M 116 170 
             L 182 170 
             C 204 170 216 180 216 198 
             C 216 210 208 220 196 226 
             C 212 232 222 244 222 262 
             C 222 284 206 296 182 296 
             L 116 296 Z 
             M 148 198 
             L 148 218 
             L 174 218 
             C 182 218 186 214 186 208 
             C 186 202 182 198 174 198 Z 
             M 148 244 
             L 148 268 
             L 178 268 
             C 186 268 192 264 192 256 
             C 192 248 186 244 178 244 Z" 
          fill="url(#neonGrad)"/>

    <!-- Letter L -->
    <path d="M 236 170 
             L 268 170 
             L 268 266 
             L 316 266 
             L 316 296 
             L 236 296 Z" 
          fill="url(#neonGrad)"/>

    <!-- Letter S -->
    <path d="M 334 268 
             L 364 264 
             C 365 272 371 276 382 276 
             C 392 276 398 271 398 264 
             C 398 256 391 251 372 246 
             C 344 238 334 228 334 208 
             C 334 185 354 170 384 170 
             C 414 170 430 186 432 208 
             L 402 211 
             C 400 202 394 196 384 196 
             C 375 196 368 200 368 207 
             C 368 214 374 218 392 222 
             C 422 230 432 242 432 262 
             C 432 286 412 300 380 300 
             C 350 300 334 286 334 268 Z" 
          fill="url(#neonGrad)"/>
  </g>

  <!-- Tech Status & Server Icon Subtitle -->
  <g transform="translate(0, 316)">
    <!-- Circuit connection lines -->
    <path d="M 120 38 L 190 38 L 205 20 L 307 20 L 322 38 L 392 38" 
          fill="none" 
          stroke="#00ff88" 
          stroke-width="2" 
          opacity="0.6"/>

    <!-- Mini Server Pulse Dot -->
    <circle cx="256" cy="20" r="4" fill="#39ff14" filter="url(#subtleGlow)"/>

    <!-- Subtitle text -->
    <text x="256" y="58" 
          text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Orbitron', monospace" 
          font-size="16" 
          font-weight="800" 
          letter-spacing="9" 
          fill="#a3f5c7" 
          filter="url(#subtleGlow)">
      LOCAL WEB SERVER
    </text>
  </g>
</svg>
